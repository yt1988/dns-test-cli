# Every push and pull request: formatting, vet, tests, a build, and a short real run from GitHub's network.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o dnstest .
      - name: Short run
        run: |
          ./dnstest -n 4 -v
          ./dnstest -n 3 -r cloudflare,google,quad9 --json > out.json
          jq -e '[.results[] | select(.up)] | length > 6' out.json
      - run: sh -n install.sh
